name: Build C++ Server (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain
      - name: Build C++ server (x64)
        shell: bash
        run: |
          CXX=g++ CC=gcc TARGET_OS=windows bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src/server/cpp/lib/
          retention-days: 30

  build-windows-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-mingw cross toolchain
        run: |
          curl -L -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz"
          tar -xJf llvm-mingw.tar.xz
          ls -d llvm-mingw-*/bin
          echo "LLVM_MINGW_BIN=$(pwd)/$(ls -d llvm-mingw-*/bin)" >> "$GITHUB_ENV"
      - name: Build C++ server (ARM64 cross)
        run: |
          CXX="$LLVM_MINGW_BIN/aarch64-w64-mingw32-clang++" \
          CC="$LLVM_MINGW_BIN/aarch64-w64-mingw32-clang" \
          TARGET_OS=windows bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: src/server/cpp/lib/
          retention-days: 30
