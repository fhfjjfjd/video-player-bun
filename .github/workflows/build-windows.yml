name: Build C++ Server (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ server (x64)
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          CXX=/c/msys64/ucrt64/bin/g++.exe TARGET_OS=windows bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src/server/cpp/lib/
          retention-days: 30

  build-windows-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-mingw cross toolchain
        run: |
          curl -L -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz"
          tar -xJf llvm-mingw.tar.xz
          ls -d llvm-mingw-*/bin
          echo "LLVM_MINGW_BIN=$(pwd)/$(ls -d llvm-mingw-*/bin)" >> "$GITHUB_ENV"
      - name: Build C++ server (ARM64 cross)
        run: |
          CXX="$LLVM_MINGW_BIN/aarch64-w64-mingw32-clang++.exe" TARGET_OS=windows bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: src/server/cpp/lib/
          retention-days: 30
