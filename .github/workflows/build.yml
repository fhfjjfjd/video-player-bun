name: Build C++ Libraries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cpp-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev
      - name: Build C++ libraries
        run: |
          mkdir -p src/server/cpp/lib
          bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: src/server/cpp/lib/
          retention-days: 30

  build-cpp-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev
      - name: Build C++ libraries (ARM64)
        run: |
          mkdir -p src/server/cpp/lib
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: src/server/cpp/lib/
          retention-days: 30

  build-cpp-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install openssl sqlite3
      - name: Build C++ libraries
        run: |
          mkdir -p src/server/cpp/lib
          bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          path: src/server/cpp/lib/
          retention-days: 30

  build-cpp-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install openssl sqlite3
      - name: Build C++ libraries (ARM64)
        run: |
          mkdir -p src/server/cpp/lib
          CC=clang CXX=clang++ bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: src/server/cpp/lib/
          retention-days: 30

  build-cpp-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: choco install openssl sqlite3
      - name: Build C++ libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/server/cpp/lib
          bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src/server/cpp/lib/
          retention-days: 30

  build-cpp-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev
      - name: Build C++ libraries (Android ARM64)
        run: |
          mkdir -p src/server/cpp/lib
          CC=aarch64-linux-android-clang CXX=aarch64-linux-android-clang++ bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: src/server/cpp/lib/
          retention-days: 30

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-cpp-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Build frontend
        run: bun run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30