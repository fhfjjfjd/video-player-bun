name: Build C++ Server (Android)

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          unzip -q ndk.zip
          echo "NDK_TOOLCHAIN=$(pwd)/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
      - name: Build C++ server (ARM64)
        run: CXX="$NDK_TOOLCHAIN/aarch64-linux-android24-clang++" CC="$NDK_TOOLCHAIN/aarch64-linux-android24-clang" bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: src/server/cpp/lib/
          retention-days: 30

  build-android-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          unzip -q ndk.zip
          echo "NDK_TOOLCHAIN=$(pwd)/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
      - name: Build C++ server (x86_64)
        run: CXX="$NDK_TOOLCHAIN/x86_64-linux-android24-clang++" CC="$NDK_TOOLCHAIN/x86_64-linux-android24-clang" bash build_cpp.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-x64
          path: src/server/cpp/lib/
          retention-days: 30
